<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#73c8f0">
    <title>Marble Run</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="game-shell">
      <header>
        <div>
          <p class="eyebrow">Build it. Run it.</p>
          <h1>Marble Run</h1>
        </div>
        <p id="status" class="status" aria-live="polite">Add a marble and watch it roll!</p>
      </header>

      <div class="stage">
        <canvas id="game" width="1000" height="600" aria-label="A marble run sandbox"></canvas>
      </div>

      <div class="controls">
        <p>Drag the track, its yellow ends, or any marble.</p>
        <div class="button-group">
          <button id="add-marble-button" type="button">+ Marble</button>
          <button id="add-ten-marbles-button" type="button">+10 Marbles</button>
          <button id="reset-button" class="secondary" type="button">↻ Reset</button>
        </div>
      </div>
    </main>

    <script src="vendor/matter.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
