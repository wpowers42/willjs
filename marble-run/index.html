<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#dff5ff" />
    <title>Marble Run: Change the Future</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <header>
        <div>
          <p class="eyebrow">Level 1 · Change the Future</p>
          <h1>Marble Run</h1>
        </div>
      </header>

      <section class="stage" aria-label="Marble run level">
        <canvas id="game" width="1000" height="600" aria-label="A side-view marble run with one marble and a goal cup"></canvas>
      </section>

      <section class="control-panel" aria-label="Run controls">
        <div class="transport-controls">
          <button id="play-button" type="button" disabled>▶ Run</button>
          <button id="reset-button" class="secondary" type="button" disabled>↺ Reset</button>
        </div>
      </section>
    </main>

    <script type="module" src="script.js"></script>
  </body>
</html>
